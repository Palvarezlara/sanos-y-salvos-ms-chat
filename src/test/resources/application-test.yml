# Valores dummy solo para tests: el contexto de Spring carga sin credenciales
# reales de Cognito, sin Mongo y sin config-server ni Eureka.
cognito:
  client-id: test-client-id

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test00000
          jwk-set-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_test00000/.well-known/jwks.json
  config:
    import: ""
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

chat:
  ticket-secret: secreto-de-prueba-de-al-menos-32-caracteres!!
  crear-indices: false

# secreto de servicio (el cliente de ms-mascotas y el filtro de X-User-Email exigen minimo 32 caracteres)
internal:
  api-token: secreto-de-servicio-de-prueba-de-al-menos-32-caracteres

sqs:
  consumidor:
    auto-arranque: false # los consumidores no deben levantar un hilo real en los tests

aws:
  region: us-east-1
  sns:
    topic-arn: arn:aws:sns:us-east-1:000000000000:test-topic
